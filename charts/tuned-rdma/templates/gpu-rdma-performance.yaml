---
apiVersion: tuned.openshift.io/v1
kind: Tuned
metadata:
  name: gpu-rdma-performance
  namespace: openshift-cluster-node-tuning-operator
spec:
  profile:
    - name: gpu-rdma-performance
      data: |
        [main]
        summary=Optimized profile for GPU and RDMA workloads
        include=openshift-node

        [sysctl]
        # RDMA memory registration: allow large pinned memory regions
        vm.zone_reclaim_mode=0

        # Increase max locked memory (needed for RDMA and GPU memory registration)
        # Effectively unlimited via ulimits, but this ensures kernel-side limits are high
        vm.max_map_count=1048576

        # Network buffer tuning for high-throughput RDMA and RoCE
        net.core.rmem_max=67108864
        net.core.wmem_max=67108864
        net.core.rmem_default=67108864
        net.core.wmem_default=67108864
        net.core.optmem_max=67108864
        net.core.netdev_max_backlog=250000
        net.ipv4.tcp_rmem=4096 87380 67108864
        net.ipv4.tcp_wmem=4096 65536 67108864
        net.ipv4.tcp_mtu_probing=1

        # Enable ECN for ROCEv2 congestion management
        net.ipv4.tcp_ecn=1

        # Disable RP filter on RDMA interfaces (avoid dropping RoCE traffic)
        net.ipv4.conf.all.rp_filter=0
        net.ipv4.conf.default.rp_filter=0

        [vm]
        # Transparent hugepages for GPU memory allocation efficiency
        transparent_hugepages=always

        [bootloader]
        # Reserve 2M hugepages for RDMA memory registration
        cmdline_gpu_rdma=hugepagesz=2M hugepages=2048 default_hugepagesz=2M

  recommend:
    - machineConfigLabels:
        machineconfiguration.openshift.io/role: "master"
      match:
        - label: "feature.node.kubernetes.io/pci-10de.present"
      priority: 20
      profile: gpu-rdma-performance
    - machineConfigLabels:
        machineconfiguration.openshift.io/role: "worker"
      match:
        - label: "feature.node.kubernetes.io/pci-10de.present"
      priority: 20
      profile: gpu-rdma-performance
